aid: apartments-com
name: Apartments.com
review:
  question: >-
    Does Apartments.com expose a public, documented developer API — and is it
    RESO-certified or otherwise reachable without a commercial or membership
    relationship?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United States
  tier: rental-listings
findings:
  summary: |
    Apartments.com (CoStar Group) publishes no public developer surface of any
    kind. There is no developer portal, no OpenAPI or Swagger document, no OData
    $metadata, no GraphQL schema, no AsyncAPI, no webhooks, no SDK and no
    Postman collection. The apex domain and every path under it are served from
    an Akamai edge that returns "HTTP 403 Access Denied" to any non-browser
    client, including /robots.txt, so even the marketing HTML is not machine
    reachable. The only documented machine-to-machine seams are INBOUND: the
    Digital Feeds Program (an approved third-party feed vendor pushes an
    advertiser's XML listings feed over FTP) and per-MLS rental-listing
    syndication opt-in. Both require a signed relationship before any bytes
    move, and neither ships a published contract.
  reso:
    certified: false
    posture: >-
      No RESO certification found. Apartments.com is a downstream CONSUMER of
      MLS rental listings via per-MLS opt-in, not a certified RESO Web API
      endpoint.
    webApiCertification: none found
    dataDictionaryCertification: none found
    dataDictionaryVersion: n/a
    universalPropertyIdentifier: no UPI reference found on any reachable
      Apartments.com surface
    odataMetadataDocument: none — https://api.apartments.com/$metadata and
      https://www.apartments.com/$metadata both return HTTP 403 (Akamai Access
      Denied), and no OData service root is documented anywhere
    directoryEvidence:
      - probe: https://www.reso.org/certificates/
        status: 200
        date: '2026-07-26'
        result: >-
          Page carries 578 distinct certification.reso.org/summary/{id} links.
          Case-insensitive search of the rendered text for "CoStar",
          "Apartments", and "Homes.com" returns 0 matches (for comparison,
          "Zillow" and "Bright MLS" each return 1). No CoStar Group entity
          appears in the RESO certificates list.
      - probe: https://certification.reso.org/
        status: 400
        date: '2026-07-26'
        result: >-
          RESO's certification directory app returns HTTP 400 to non-browser
          clients at the root and at /summary/C00000001, /search and
          /api/certificates, so it could not be queried programmatically. The
          reso.org/certificates/ listing above was used instead.
      - probe: https://propertyhelp.apartments.com/search?query=reso
        status: 200
        date: '2026-07-26'
        result: >-
          ZERO articles returned. Apartments.com's own property-manager help
          centre never mentions RESO. A query for "rets" returns only an MLS
          opt-in article (Garden State MLS) matched on other terms; a query for
          "webhook" returns zero articles.
    mlsRelationship: >-
      Apartments.com receives rental listings from MLSs when a licensed agent or
      broker opts in inside their own MLS system. Ten MLSs are individually
      documented at
      https://propertyhelp.apartments.com/collection/1201-mls-integrations
      (HTTP 200): Bright MLS, ARMLS, REcolorado, OneKey MLS, SmartMLS,
      Northstar MLS, MLS Property Information Network, Garden State MLS,
      New Jersey MLS, and Aspen Glenwood MLS. The direction of travel is INTO
      Apartments.com. Nothing flows back out to a developer.
    caveat: >-
      Sibling CoStar brand Homes.com is publicly described (RESO/third-party
      write-ups) as having standardised its MLS ingestion on the RESO Data
      Dictionary and Web API. That is a claim about Homes.com's data pipeline,
      not about Apartments.com, and it is NOT a certification. It is recorded
      here only so the two facts are never conflated.
  accessGate:
    classification: partner-only
    whatADeveloperMustSignOrJoin: |
      There is no path by which an independent developer obtains credentials.
      Two documented relationships exist, both inbound:
        1. DIGITAL FEEDS PROGRAM. You must (a) be a paying Apartments.com
           advertiser with listings, (b) apply by emailing Feeds@apartments.com
           or via https://www.apartments.com/advertise/advfeeds, and (c) route
           your data through an approved third-party feed vendor. The
           Apartments.com listings-feed XML guide is not published — it is
           supplied on request. Transport documented in the help centre is FTP
           (the MRI Market Connect article requires FTP Server Name, FTP Login
           and FTP Password to register a new ILS).
        2. MLS SYNDICATION OPT-IN. You must hold membership in a participating
           MLS and toggle Apartments.com syndication inside that MLS's own
           system. This requires MLS membership plus, in practice, a real-estate
           licence.
      Neither issues an API key. Neither returns data to the caller.
    readAccessToListingData: none published at any price via a first-party
      interface; the only "Apartments.com APIs" on the open web are unofficial
      third-party scrapers (Apify, PropAPIS, RapidAPI-style listings) that are
      not operated by or endorsed by Apartments.com and are not recorded here.
    selfServeDeveloperPortal: false
  openData:
    exists: false
    note: >-
      Apartments.com publishes no open, unlicensed, publicly callable dataset.
      All listing content is proprietary CoStar Group inventory attached to paid
      advertising, or licensed MLS content syndicated under MLS rules. Unlike
      the UK/AU government counterweight (HM Land Registry Price Paid, Ordnance
      Survey open products), the US rental market has no equivalent open
      publication and Apartments.com adds none.
  authModel:
    scheme: none published
    detail: >-
      No API key, OAuth 2.0, OpenID Connect or SAML developer scheme is
      documented. Feed authentication is FTP username/password issued
      out-of-band between the feed vendor and Apartments.com. Advertiser and
      renter accounts use ordinary web session logins on
      https://www.apartments.com (403 to non-browser clients).
    openidConfiguration: >-
      https://www.apartments.com/.well-known/openid-configuration and
      https://api.apartments.com/.well-known/openid-configuration both return
      HTTP 403 (Akamai Access Denied) — not a JSON discovery document.
  webhooksEventsSdksPostman:
    webhooks: none documented (help-centre search for "webhook" returns zero
      articles)
    events: none documented
    sdks: none published
    postman: none published
    cli: none published
    graphql: none documented
    note: >-
      Absence is the finding. The nearest thing to event delivery is lead
      routing — Apartments.com pushes enquiry leads into an advertiser's CRM
      through the PMS/CRM vendor's own integration (Yardi, Rent Manager,
      WelcomeHome, EliseAI), configured in the vendor's product, not by an
      Apartments.com-published contract.
  productApiFamily:
    note: >-
      Apartments.com's real segmentation, taken from the surfaces that answered,
      is a product taxonomy rather than an API taxonomy. None of these are
      exposed as callable APIs.
    segments:
      - listings-and-syndication: connect/update listings via ILS feed;
          per-MLS rental syndication opt-in
      - media: unit-level images, virtual tours, MyMedia
      - pricing-and-concessions: price by lease term / move-in date,
          concessions (e.g. RealPage OneSite GetConcessions), fee transparency
      - availability-and-occupancy: occupancy reporting (e.g. Yardi Voyager)
      - leads-and-attribution: True Leads, lead attribution and CRM delivery
      - online-leasing: apply-now, tour scheduling, applications and screening
      - tenancy-and-payments: Rental Manager landlord tools — leases, payments,
          applications, screening, 1099-K
  githubPresence:
    org: https://github.com/AptsCom
    verified: true
    detail: >-
      GitHub organisation "Apartments.com" (login AptsCom, blog
      http://www.apartments.com), 15 public repositories, all forks or training
      scaffolding, newest first-party content circa 2014. Zero API artifacts.
      Parent org https://github.com/CoStarGroup — "The Leader in Commercial Real
      Estate Information and Online Marketplaces", Washington DC, 5 public
      repositories, all JavaScript tooling forks. Zero API artifacts.
