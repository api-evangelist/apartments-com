quotes:
  - source: https://propertyhelp.apartments.com/article/439-what-is-a-feed
    text: >-
      "A feed is a third party vendor who will syndicate the listing into
      Apartments.com. There are numerous data feed providers, and our Digital
      Feeds Program will set you up with the best one that fits your needs. ...
      Ready to learn more or apply for the Digital Feeds Program? If so, be sure
      to email us at Feeds@apartments.com or visit our page about the Digital
      Feeds Program."
  - source: https://propertyhelp.apartments.com/article/1041-how-do-i-connect-my-listing-to-apartmentscom-using-mri-market-connect
    text: >-
      "Prerequisites — You must identify the following FTP server information
      from the ILS you wish to add: FTP Server Name, FTP Login (Username), FTP
      Password."
unverifiedSnippets:
  - claim: >-
      The Apartments.com property data feed is based on the MITS feed format and
      requires an XML file created by the vendor's technical team; the
      Apartments.com Listings feed XML Guide is available on request. The
      advertise/faqfeeds page is reported to say Apartments.com accepts RETS and
      IDX feeds (.csv) as well as XML, and the grow/mls page to say it accepts
      API, RETS, IDX and XML from MLSs.
    sourcePages:
      - https://ecom.apartments.com/advertise/resources/listings-feed-program
      - https://www.apartments.com/advertise/faqfeeds
      - https://www.apartments.com/grow/mls
    status: NOT VERIFIED
    reason: >-
      All three pages return HTTP 403 to every client we control. The wording
      above comes from search-engine snippets only. It is recorded so the seam
      is not lost, and is deliberately NOT asserted in apis.yml.
sources:
  - url: https://propertyhelp.apartments.com/
    type: Documentation
    note: Property Owner and Manager Help Center — ILS + MLS integration collections
  - url: https://propertyhelp.apartments.com/collection/1044-ils-integrations
    type: Documentation
    note: >-
      PMS integrations documented: AppFolio, Yardi (RentCafe, Voyager, Breeze),
      RealPage (LeaseStar / Marketing Center / OneSite), Rent Manager (12 and
      Express), Entrata, ResMan, MRI Market Connect, Funnel, EliseAI, Fortress,
      Engrain, Rhenti.
  - url: https://propertyhelp.apartments.com/collection/1201-mls-integrations
    type: Documentation
    note: Ten per-MLS rental-syndication opt-in articles
  - url: https://www.reso.org/certificates/
