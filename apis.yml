aid: apartments-com
name: Apartments.com
kind: company
description: >-
  Apartments.com is the largest United States rental-listings marketplace, owned
  by CoStar Group since its 2014 acquisition and operated from Arlington,
  Virginia as the anchor of the Apartments.com Network — a group of consumer
  rental sites that also includes ApartmentFinder.com, ApartmentHomeLiving.com,
  ForRent.com, ForRentUniversity.com, WestsideRentals.com, Apartamentos.com,
  After55.com and CorporateHousing.com. It sits on the demand side of the US
  residential value chain as an Internet Listing Service (ILS): apartment owners
  and property managers buy advertising, and their inventory, availability,
  pricing, media, concessions and fee data flows in from property management
  systems (Yardi, RealPage, Entrata, MRI, AppFolio, ResMan, Rent Manager,
  Funnel, EliseAI and others) rather than from any public API, while leads flow
  back out to the advertiser's CRM. Its API posture is closed. Apartments.com
  publishes no developer portal, no OpenAPI or OData $metadata contract, no SDK,
  no webhooks and no Postman collection; developer.apartments.com,
  developers.apartments.com and docs.apartments.com do not resolve in DNS, and
  api.apartments.com resolves only to the same Akamai edge that returns HTTP 403
  Access Denied to every non-browser request, including robots.txt. The one
  documented machine-to-machine seam is the Digital Feeds Program — an
  approval-and-contract path in which an approved third-party feed vendor
  syndicates a paying advertiser's listings into Apartments.com over FTP using
  an XML listings feed whose specification guide is available only on request to
  Feeds@apartments.com. A second inbound seam lets licensed agents opt in to
  rental-listing syndication through their own MLS (Bright MLS, ARMLS,
  REcolorado, OneKey MLS, SmartMLS, NorthstarMLS, MLS PIN, Garden State MLS, New
  Jersey MLS and Aspen Glenwood MLS are documented), which requires MLS
  membership. On RESO, the honest reading is absence rather than
  "certified but unreachable": Apartments.com does not appear anywhere in the
  RESO certificates list, and its own property-manager help centre returns zero
  results for "RESO". It is a consumer of MLS rental feeds, not a certified
  RESO endpoint, and no unlicensed open dataset is published.
